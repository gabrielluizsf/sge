name: Deno
description: Deno at a pinned version, its download checked against its SHA-256 and kept in the cache, so a job has it in seconds.

runs:
  using: composite
  steps:
    - name: Restore Deno
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.deno-bin
        key: deno-2.9.8-linux-x64

    - name: Download Deno
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL -o "$RUNNER_TEMP/deno.zip" https://dl.deno.land/release/v2.9.8/deno-x86_64-unknown-linux-gnu.zip
        echo "a39762429792913fe762ef0b59c9cba41dbd38195984da99221a193b13d97b40  $RUNNER_TEMP/deno.zip" | sha256sum -c -
        mkdir -p ~/.deno-bin
        unzip -q "$RUNNER_TEMP/deno.zip" -d ~/.deno-bin

    - name: Put Deno on the path
      shell: bash
      run: echo "$HOME/.deno-bin" >> "$GITHUB_PATH"
