name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Jobs run at once: the Go tests in one, and the transpiler's, which run
# the engine's tests on Deno, split among several by how long they take.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          cache: go

      - name: Vet
        run: go vet ./...

      - name: Test all but the transpiler
        run: go test $(go list ./... | grep -v '/gots$')

      - name: Test native without cgo, as games build it
        run: CGO_ENABLED=0 go test -count=3 ./native

  deno:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The engine's slowest packages on Deno, each in a job of its own.
          - part: bake
            engine: bake
            run: TestEngineOnDeno
          - part: building
            engine: building
            run: TestEngineOnDeno
          - part: water-tree
            engine: water,tree
            run: TestEngineOnDeno
          - part: engine
            engine: -bake,building,water,tree
            run: TestEngineOnDeno
          - part: boundary
            run: TestTypeScriptBoundary
          - part: programs
            run: TestConformance|TestBenchmarksOnDeno|TestTLSConfigNeverFetches
          - part: rest
            skip: TestEngineOnDeno|TestTypeScriptBoundary|TestConformance|TestBenchmarksOnDeno|TestTLSConfigNeverFetches
            package: true
    name: deno (${{ matrix.part }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          cache: deno-${{ matrix.part }}
      - uses: ./.github/actions/deno

      - name: Test
        env:
          GOTS_ENGINE: ${{ matrix.engine }}
        run: go test -run '${{ matrix.run }}' -skip '${{ matrix.skip }}' ./gots

      - name: Generate the TypeScript
        if: matrix.package
        run: go generate .

      - name: Type-check the TypeScript example
        if: matrix.package
        run: deno check examples/collect/collect.ts

      - name: Check the package publishes
        if: matrix.package
        run: deno publish --dry-run --allow-dirty

  # The installer writes to each system's own places, so it is tested on
  # each system; build tags keep one system's tests off the others.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          cache: installer

      - name: Vet
        run: go vet ./installer/...

      - name: Test
        run: go test -count=1 ./installer/...
