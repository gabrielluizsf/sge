name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Vet
        run: go vet ./...

      # The Go tests also transpile the engine and run its tests, and the
      # transpiler's conformance programs, on Deno.
      - name: Test
        run: go test ./...

      - name: Test native without cgo, as games build it
        run: CGO_ENABLED=0 go test -count=3 ./native

      - name: Generate the TypeScript
        run: go generate .

      - name: Type-check the TypeScript example
        run: deno check examples/collect/collect.ts

  # The installer writes to each system's own places, so it is tested on
  # each system; build tags keep one system's tests off the others.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Vet
        run: go vet ./installer/...

      - name: Test
        run: go test -count=1 ./installer/...
