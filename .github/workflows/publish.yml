name: Publish
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/go
        with:
          cache: publish
      - uses: ./.github/actions/deno

      # The package is the TypeScript gots writes from the Go packages.
      - name: Generate the TypeScript
        run: go generate .

      - name: Publish package
        run: deno publish
